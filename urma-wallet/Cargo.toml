[package]
name = "urma-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]
description = "URMA wallet funding, addresses and transaction signing"

[dependencies]
bitcoin = "0.32"
serde = { version = "1", features = ["derive"] }
urma-core = { version = "0.2.1", path = "../urma-core" }
urma-chain = { version = "0.2.1", path = "../urma-chain" }
urma-identity = { version = "0.2.1", path = "../urma-identity" }
bech32 = "0.11"
