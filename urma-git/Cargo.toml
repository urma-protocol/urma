[package]
name = "urma-git"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = false
include = ["Cargo.toml", "src/**/*.rs"]
description = "URMA Git snapshots, publication and verified checkout"

[dependencies]
urma-profiles = { version = "0.1.1", path = "../urma-profiles" }
urma-io = { version = "0.1.1", path = "../urma-io" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
regex = "1"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"

bitcoin = { version = "0.32", features = ["serde"] }
urma-core = { version = "0.1.1", path = "../urma-core" }
urma-chain = { version = "0.1.1", path = "../urma-chain" }
urma-runtime = { version = "0.1.1", path = "../urma-runtime" }
urma-identity = { version = "0.1.1", path = "../urma-identity" }

[dev-dependencies]
anyhow = "1"
