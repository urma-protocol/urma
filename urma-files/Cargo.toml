[package]
name = "urma-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = false
include = ["Cargo.toml", "src/**/*.rs"]
description = "URMA archive and capture ingestion, catalogs and recovery"

[dependencies]
urma-core = { version = "0.2.0", path = "../urma-core" }
urma-identity = { version = "0.2.0", path = "../urma-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
tracing = "0.1"
urma-io = { version = "0.2.0", path = "../urma-io" }
unicode-normalization = "0.1"

bitcoin = "0.32"
urma-runtime = { version = "0.2.0", path = "../urma-runtime" }

[dev-dependencies]
tempfile = "3"
