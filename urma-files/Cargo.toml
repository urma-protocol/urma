[package]
name = "urma-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
urma-core = { path = "../urma-core" }
urma-identity = { path = "../urma-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
tracing = "0.1"
