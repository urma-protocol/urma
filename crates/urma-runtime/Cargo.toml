[package]
name = "urma-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
tracing = "0.1"
urma = { path = "../urma" }
urma-core = { path = "../urma-core" }
urma-chain = { path = "../urma-chain" }
urma-identity = { path = "../urma-identity" }
urma-wallet = { path = "../urma-wallet" }
