[package]
name = "urma-git"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
urma-profiles = { path = "../urma-profiles" }
urma-io = { path = "../urma-io" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
regex = "1"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"

bitcoin = { version = "0.32", features = ["serde"] }
urma-core = { path = "../urma-core" }
urma-chain = { path = "../urma-chain" }
urma-runtime = { path = "../urma-runtime" }
urma-identity = { path = "../urma-identity" }

[dev-dependencies]
anyhow = "1"
