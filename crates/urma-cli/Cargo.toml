[package]
name = "urma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "urma"
path = "src/main.rs"

[dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
bitcoincore-rpc = "0.19"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
minreq = { version = "2.14", features = ["https-rustls"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
zeroize = "1"
tracing = "0.1"

urma = { path = "../urma" }
urma-core = { path = "../urma-core" }
urma-profiles = { path = "../urma-profiles" }
urma-identity = { path = "../urma-identity" }
urma-wallet = { path = "../urma-wallet" }
urma-workflows = { path = "../urma-workflows" }

urma-chain = { path = "../urma-chain" }

[dev-dependencies]
anyhow = "1"
