[workspace]
resolver = "3"
members = [
    "urma-io",
    "urma-core",
    "urma-chain",
    "urma-identity",
    "urma-wallet",
    "urma-workflows",
    "urma-profiles",
    "urma-cli",
    "urma-wire",
    "urma-runtime",
    "urma-files",
    "urma-git",
