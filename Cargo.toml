[workspace]
resolver = "3"
members = [
    "urma-io",
    "urma-core",
    "urma-chain",
    "urma-identity",
    "urma-wallet",
    "urma-workflows",
    "urma-profiles",
    "urma-cli",
    "urma-wire",
    "urma-runtime",
    "urma-files",
    "urma-git",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = ["crates-io"]
repository = "https://github.com/urma-protocol/urma"
