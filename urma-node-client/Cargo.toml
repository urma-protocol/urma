[package]
name = "urma-node-client"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]
description = "Optional local URMA service client without daemon or peer runtime"

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
urma-chain = { path = "../urma-chain", version = "0.3.0" }
urma-core = { path = "../urma-core", version = "0.3.0" }
urma-wire = { path = "../urma-wire", version = "0.3.0" }
urma-names = { path = "../urma-names", version = "0.3.0" }
