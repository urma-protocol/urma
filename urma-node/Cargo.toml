[package]
name = "urma-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Optional URMA archive engine and background service"

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urma-chain = { path = "../urma-chain", version = "0.2.2" }
urma-core = { path = "../urma-core", version = "0.2.2" }
urma-runtime = { path = "../urma-runtime", version = "0.2.2" }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
