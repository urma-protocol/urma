[package]
name = "urma-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = false
include = ["Cargo.toml", "src/**/*.rs"]
description = "URMA blockchain observations, transaction decoding and proof-of-work validation"

[dependencies]
bitcoin = "0.32"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
litecoin = { version = "=0.32.8-rc.1", default-features = false, features = ["std"] }
