[package]
name = "urma-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = false
include = ["Cargo.toml", "src/**/*.rs"]
description = "URMA Wire proof reading, confirmed indexing and reorganization handling"

[dependencies]
urma-chain = { version = "0.1.0", path = "../urma-chain" }
urma-profiles = { version = "0.1.0", path = "../urma-profiles" }
urma-io = { version = "0.1.0", path = "../urma-io" }
urma-core = { version = "0.1.0", path = "../urma-core" }
bitcoin = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tempfile = "3"
tracing = "0.1"
